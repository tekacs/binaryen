name: Build Release Artifacts

# Run explicitly against a release tag. Publishing a tag does not launch builders.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: x86_64-linux
            suffix: ''
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: aarch64-linux
            suffix: ''
            arch: aarch64
          - runner: macos-15-intel
            platform: x86_64-macos
            suffix: ''
            arch: x86_64
          - runner: macos-15
            platform: arm64-macos
            suffix: ''
            arch: arm64
          - runner: windows-latest
            platform: x86_64-windows
            suffix: .exe
            arch: x64
          - runner: windows-11-arm
            platform: arm64-windows
            suffix: .exe
            arch: ARM64
    defaults:
      run:
        shell: bash
    env:
      SUFFIX: ${{ matrix.suffix }}
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Require an explicit release tag
        run: |
          [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" == version_*-tekacs.* ]]
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build static Linux tools
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.22 sh -ec '
            apk add --no-cache build-base cmake ninja git python3
            cmake -S . -B out -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DBUILD_LLVM_DWARF=ON \
              -DBUILD_MIMALLOC=ON -DCMAKE_C_FLAGS=-static -DCMAKE_CXX_FLAGS=-static \
              -DCMAKE_EXE_LINKER_FLAGS="-Wl,-z,stack-size=8388608"
            cmake --build out --target wasm-opt wasm-dis --parallel 3
          '
      - name: Build native tools
        if: runner.os != 'Linux'
        run: |
          args=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            args+=(-A "$ARCH" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded)
          else
            args+=(-DCMAKE_OSX_ARCHITECTURES="$ARCH")
          fi
          cmake -S . -B out -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTS=OFF -DBUILD_LLVM_DWARF=ON "${args[@]}"
          cmake --build out --config Release --target wasm-opt wasm-dis --parallel 3
      - name: Verify release identity and DWARF
        env:
          BINARYEN_BIN: ${{ github.workspace }}/out/bin
          BINARYEN_OUT_DIR: ${{ github.workspace }}/out/tests
        run: |
          version=$("out/bin/wasm-opt$SUFFIX" --version)
          expected="wasm-opt version ${GITHUB_REF_NAME#version_}"
          [[ "$version" == "$expected" || "$version" == "$expected ("* ]]
          python3 -m unittest test.unit.test_dwarf test.unit.test_dwarf_lines --verbose
      - name: Package tools and licenses
        run: |
          package="binaryen-$GITHUB_REF_NAME"
          asset="$package-$PLATFORM.tar.gz"
          mkdir -p "$package/bin" "$package/licenses"
          cp "out/bin/wasm-opt$SUFFIX" "out/bin/wasm-dis$SUFFIX" "$package/bin/"
          cp LICENSE "$package/licenses/Binaryen-LICENSE"
          cp third_party/llvm-project/include/llvm/LICENSE.TXT "$package/licenses/LLVM-LICENSE.TXT"
          cp third_party/llvm-project/include/llvm/Support/LICENSE.TXT "$package/licenses/LLVM-Support-LICENSE.TXT"
          cp third_party/FP16/LICENSE "$package/licenses/FP16-LICENSE"
          cp third_party/mimalloc/LICENSE "$package/licenses/mimalloc-LICENSE"
          printf '%s\n' "$GITHUB_SHA" > "$package/SOURCE"
          tar -czf "$asset" "$package"
          cmake -E sha256sum "$asset" > "$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: binaryen-${{ matrix.platform }}
          path: |
            binaryen-*.tar.gz
            binaryen-*.tar.gz.sha256
          if-no-files-found: error
